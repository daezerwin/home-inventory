name: inventory
type: laravel
docroot: public
php_version: "8.4"
webserver_type: nginx-fpm
xdebug_enabled: false
database:
  type: mariadb
  version: "11.8"
omit_containers: [db]
use_dns_when_possible: true
timezone: Asia/Manila
composer_version: "2"
disable_settings_management: true
web_environment:
  - DB_CONNECTION=sqlite
  - DB_DATABASE=/var/www/html/database/database.sqlite
  - APP_URL=https://inventory.ddev.site
web_extra_daemons:
  - name: image-worker
    command: php artisan queue:work --sleep=3 --tries=3 --timeout=45
    directory: /var/www/html
