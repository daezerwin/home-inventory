<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#7c263e">
    <title>Offline · Home Pantry</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml">
    <!-- Shown by sw.js when a page can't load without a connection; self-contained on purpose. -->
    <style>
        :root { --maroon: #7c263e; --ink: #292b2d; --muted: #89888a; --line: #ece9e6; --bg: #faf9f7; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); color: var(--ink); font: 15px/1.6 "DM Sans", system-ui, -apple-system, sans-serif; }
        main { width: min(420px, 100%); padding: 32px 28px; text-align: center; background: #fff; border: 1px solid var(--line); border-radius: 16px; }
        img { width: 64px; height: 64px; }
        h1 { margin: 18px 0 8px; font: 800 26px/1.2 "Manrope", system-ui, sans-serif; letter-spacing: -0.6px; }
        p { margin: 0 0 24px; color: var(--muted); }
        .actions { display: flex; flex-direction: column; gap: 10px; }
        a, button { display: block; padding: 12px 16px; border-radius: 8px; border: 1px solid var(--line); background: #fff; color: var(--ink); font-family: inherit; font-size: 14px; font-weight: 600; text-decoration: none; cursor: pointer; }
        a { background: var(--maroon); border-color: var(--maroon); color: #fff; }
    </style>
</head>
<body>
<main>
    <img src="/icon.svg" alt="">
    <h1>You're offline.</h1>
    <p>This page needs a connection. Your shopping list still opens, and ticks you make sync when you're back online.</p>
    <div class="actions">
        <a href="/shopping-list">Open my shopping list</a>
        <button type="button" onclick="location.reload()">Try again</button>
    </div>
</main>
</body>
</html>
